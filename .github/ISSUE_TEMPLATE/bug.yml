name: Bug report
description: Report a reproducible defect
body:
  - type: textarea
    attributes: {label: "What happened?"}
    validations: {required: true}
  - type: textarea
    attributes: {label: Reproduction and environment}
    validations: {required: true}
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: This report contains no credentials or private topology.
          required: true
